5" y="265.0" font-size="20" text-anchor="middle" fill="#172536">S-G1</text><text x="682.5" y="289.0" font-size="20" text-anchor="middle" fill="#172536">Payment result returned</text><ellipse cx="1587.5" cy="270.0" rx="210.0" ry="50.0" fill="#e5f2e6" stroke="#475569" stroke-width="1.8"/><text x="1587.5" y="253.0" font-size="20" text-anchor="middle" fill="#172536">S-G2</text><text x="1587.5" y="277.0" font-size="20" text-anchor="middle" fill="#172536">Instructed transfers accounted</text><text x="1587.5" y="301.0" font-size="20" text-anchor="middle" fill="#172536">for</text><polygon points="306.25,440 606.25,440 626.25,499.0 606.25,558 306.25,558 286.25,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="456.25" y="482.0" font-size="20" text-anchor="middle" fill="#172536">S-T1</text><text x="456.25" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Process sandbox payment</text><text x="456.25" y="530.0" font-size="20" text-anchor="middle" fill="#172536">request</text><polygon points="758.75,440 1058.75,440 1078.75,499.0 1058.75,558 758.75,558 738.75,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="908.75" y="482.0" font-size="20" text-anchor="middle" fill="#172536">S-T2</text><text x="908.75" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Return success, decline</text><text x="908.75" y="530.0" font-size="20" text-anchor="middle" fill="#172536">or error outcome</text><polygon points="1211.25,440 1511.25,440 1531.25,499.0 1511.25,558 1211.25,558 1191.25,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="1361.25" y="482.0" font-size="20" text-anchor="middle" fill="#172536">S-T3</text><text x="1361.25" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Execute instructed test</text><text x="1361.25" y="530.0" font-size="20" text-anchor="middle" fill="#172536">transfers</text><polygon points="1663.75,440 1963.75,440 1983.75,499.0 1963.75,558 1663.75,558 1643.75,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="1813.75" y="482.0" font-size="20" text-anchor="middle" fill="#172536">S-T4</text><text x="1813.75" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Return transfer status</text><text x="1813.75" y="530.0" font-size="20" text-anchor="middle" fill="#172536">and reference</text><rect x="286.25" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="456.25" y="707.0" font-size="20" text-anchor="middle" fill="#172536">S-R1</text><text x="456.25" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Valid sandbox payment</text><text x="456.25" y="755.0" font-size="20" text-anchor="middle" fill="#172536">request</text><rect x="738.75" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="908.75" y="719.0" font-size="20" text-anchor="middle" fill="#172536">S-R2</text><text x="908.75" y="743.0" font-size="20" text-anchor="middle" fill="#172536">Gateway payment outcome</text><rect x="1191.25" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1361.25" y="707.0" font-size="20" text-anchor="middle" fill="#172536">S-R3</text><text x="1361.25" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Producer transfer</text><text x="1361.25" y="755.0" font-size="20" text-anchor="middle" fill="#172536">instructions</text><rect x="1643.75" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1813.75" y="707.0" font-size="20" text-anchor="middle" fill="#172536">S-R4</text><text x="1813.75" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Settlement transfer</text><text x="1813.75" y="755.0" font-size="20" text-anchor="middle" fill="#172536">outcome</text><path d="M 530.5 997.0 C 474.5 983.0 558.5 953.0 618.5 977.0 C 674.5 960.0 770.5 963.0 790.5 985.0 C 906.5 977.0 906.5 1023.0 842.5 1030.0 C 882.5 1063.0 754.5 1073.0 710.5 1050.0 C 622.5 1073.0 514.5 1059.0 534.5 1038.0 C 466.5 1031.0 478.5 1005.0 530.5 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="682.5" y="1010.0" font-size="20" text-anchor="middle" fill="#172536">S-Q1</text><text x="682.5" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Reliable transaction outcomes</text><path d="M 1435.5 997.0 C 1379.5 983.0 1463.5 953.0 1523.5 977.0 C 1579.5 960.0 1675.5 963.0 1695.5 985.0 C 1811.5 977.0 1811.5 1023.0 1747.5 1030.0 C 1787.5 1063.0 1659.5 1073.0 1615.5 1050.0 C 1527.5 1073.0 1419.5 1059.0 1439.5 1038.0 C 1371.5 1031.0 1383.5 1005.0 1435.5 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="1587.5" y="1010.0" font-size="20" text-anchor="middle" fill="#172536">S-Q2</text><text x="1587.5" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Auditable transfers</text><text x="260" y="1101" font-size="18" text-anchor="start" fill="#243246">Delegated goals / interface resources: endpoint IDs are resolved in the dependency views.</text><text x="50" y="1291" font-size="18" text-anchor="start" fill="#243246">Oval = goal | Hexagon = task | Rectangle = resource | Cloud = quality (softgoal). Child -&gt; parent AND = all; OR = an alternative. Resource -&gt; task = needed-by. Help / Hurt = quality contribution; qualifies =</text><text x="50" y="1314" font-size="18" text-anchor="start" fill="#243246">desired resource quality.</text><text x="50" y="1381" font-size="18" text-anchor="start" fill="#243246">Read with README.md and the dependency views. Dependencies point from the actor relying on something to its provider. Repeated endpoint IDs refer to the same element. Conditional tasks describe</text><text x="50" y="1404" font-size="18" text-anchor="start" fill="#243246">responsibilities, not a mandatory sequence of process steps.</text></g></svg>