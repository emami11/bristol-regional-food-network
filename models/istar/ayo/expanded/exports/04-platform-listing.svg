ize="20" text-anchor="middle" fill="#172536">Platform</text><ellipse cx="1135.0" cy="270.0" rx="210.0" ry="50.0" fill="#e5f2e6" stroke="#475569" stroke-width="1.8"/><text x="1135.0" y="265.0" font-size="20" text-anchor="middle" fill="#172536">M-G1</text><text x="1135.0" y="289.0" font-size="20" text-anchor="middle" fill="#172536">Valid product listings published</text><polygon points="381.66666666666674,440 681.6666666666667,440 701.6666666666667,499.0 681.6666666666667,558 381.66666666666674,558 361.66666666666674,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="531.6666666666667" y="482.0" font-size="20" text-anchor="middle" fill="#172536">M-T1</text><text x="531.6666666666667" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Validate mandatory</text><text x="531.6666666666667" y="530.0" font-size="20" text-anchor="middle" fill="#172536">product information</text><polygon points="985.0,440 1285.0,440 1305.0,499.0 1285.0,558 985.0,558 965.0,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="1135.0" y="482.0" font-size="20" text-anchor="middle" fill="#172536">M-T2</text><text x="1135.0" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Check applicable organic</text><text x="1135.0" y="530.0" font-size="20" text-anchor="middle" fill="#172536">certification</text><polygon points="1588.3333333333333,440 1888.3333333333333,440 1908.3333333333333,499.0 1888.3333333333333,558 1588.3333333333333,558 1568.3333333333333,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="1738.3333333333333" y="482.0" font-size="20" text-anchor="middle" fill="#172536">M-T3</text><text x="1738.3333333333333" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Publish valid products</text><text x="1738.3333333333333" y="530.0" font-size="20" text-anchor="middle" fill="#172536">and provide feedback</text><rect x="361.66666666666674" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="531.6666666666667" y="707.0" font-size="20" text-anchor="middle" fill="#172536">M-R1</text><text x="531.6666666666667" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Submitted product</text><text x="531.6666666666667" y="755.0" font-size="20" text-anchor="middle" fill="#172536">information</text><rect x="965.0" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1135.0" y="707.0" font-size="20" text-anchor="middle" fill="#172536">M-R3</text><text x="1135.0" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Certification check</text><text x="1135.0" y="755.0" font-size="20" text-anchor="middle" fill="#172536">outcome</text><rect x="1568.3333333333333" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1738.3333333333333" y="707.0" font-size="20" text-anchor="middle" fill="#172536">M-R4</text><text x="1738.3333333333333" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Certification request and</text><text x="1738.3333333333333" y="755.0" font-size="20" text-anchor="middle" fill="#172536">evidence</text><path d="M 530.5 997.0 C 474.5 983.0 558.5 953.0 618.5 977.0 C 674.5 960.0 770.5 963.0 790.5 985.0 C 906.5 977.0 906.5 1023.0 842.5 1030.0 C 882.5 1063.0 754.5 1073.0 710.5 1050.0 C 622.5 1073.0 514.5 1059.0 534.5 1038.0 C 466.5 1031.0 478.5 1005.0 530.5 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="682.5" y="1010.0" font-size="20" text-anchor="middle" fill="#172536">M-Q1</text><text x="682.5" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Reliable automated processing</text><path d="M 1435.5 997.0 C 1379.5 983.0 1463.5 953.0 1523.5 977.0 C 1579.5 960.0 1675.5 963.0 1695.5 985.0 C 1811.5 977.0 1811.5 1023.0 1747.5 1030.0 C 1787.5 1063.0 1659.5 1073.0 1615.5 1050.0 C 1527.5 1073.0 1419.5 1059.0 1439.5 1038.0 C 1371.5 1031.0 1383.5 1005.0 1435.5 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="1587.5" y="1010.0" font-size="20" text-anchor="middle" fill="#172536">M-Q2</text><text x="1587.5" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Efficient product management</text><text x="260" y="1101" font-size="18" text-anchor="start" fill="#243246">Delegated goals / interface resources: endpoint IDs are resolved in the dependency views.</text><ellipse cx="470.0" cy="1175.0" rx="200.0" ry="45.0" fill="#e5f2e6" stroke="#475569" stroke-width="1.8"/><text x="470.0" y="1158.0" font-size="20" text-anchor="middle" fill="#172536">M-G5</text><text x="470.0" y="1182.0" font-size="20" text-anchor="middle" fill="#172536">Corrected product information</text><text x="470.0" y="1206.0" font-size="20" text-anchor="middle" fill="#172536">obtained</text><rect x="1135.0" y="1130" width="400" height="90" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1335.0" y="1158.0" font-size="20" text-anchor="middle" fill="#172536">M-R5</text><text x="1335.0" y="1182.0" font-size="20" text-anchor="middle" fill="#172536">Validation and correction</text><text x="1335.0" y="1206.0" font-size="20" text-anchor="middle" fill="#172536">feedback</text><text x="50" y="1291" font-size="18" text-anchor="start" fill="#243246">Oval = goal | Hexagon = task | Rectangle = resource | Cloud = quality (softgoal). Child -&gt; parent AND = all; OR = an alternative. Resource -&gt; task = needed-by. Help / Hurt = quality contribution; qualifies =</text><text x="50" y="1314" font-size="18" text-anchor="start" fill="#243246">desired resource quality.</text><text x="50" y="1381" font-size="18" text-anchor="start" fill="#243246">Read with README.md and the dependency views. Dependencies point from the actor relying on something to its provider. Repeated endpoint IDs refer to the same element. Conditional tasks describe</text><text x="50" y="1404" font-size="18" text-anchor="start" fill="#243246">responsibilities, not a mandatory sequence of process steps.</text></g></svg>