e="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="754.0" y="813.0" width="52" height="23" fill="#ffffff"/><text x="780.0" y="830.0" text-anchor="middle" fill="#334155" font-size="17">Help</text><polyline points="852.5,499.0 877.5,499.0 877.5,868 1587.5,868 1587.5,965" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1206.5" y="841.0" width="52" height="23" fill="#ffffff"/><text x="1232.5" y="858.0" text-anchor="middle" fill="#334155" font-size="17">Hurt</text><polyline points="1757.5,499.0 1782.5,499.0 1782.5,896 682.5,896 682.5,965" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1206.5" y="869.0" width="52" height="23" fill="#ffffff"/><text x="1232.5" y="886.0" text-anchor="middle" fill="#334155" font-size="17">Help</text><polyline points="1757.5,499.0 1782.5,499.0 1782.5,924 1587.5,924 1587.5,965" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1659.0" y="897.0" width="52" height="23" fill="#ffffff"/><text x="1685.0" y="914.0" text-anchor="middle" fill="#334155" font-size="17">Hurt</text><text x="50" y="60" font-size="32" text-anchor="start" fill="#243246">Platform: certification outage alternatives</text><text x="50" y="101" font-size="19" text-anchor="start" fill="#243246">3 November 2026 | Use Case 1 automated responsibilities</text><ellipse cx="125.0" cy="260.0" rx="80.0" ry="80.0" fill="#e7ecef" stroke="#475569" stroke-width="1.8"/><text x="125.0" y="255.0" font-size="20" text-anchor="middle" fill="#172536">Marketplace</text><text x="125.0" y="279.0" font-size="20" text-anchor="middle" fill="#172536">Platform</text><ellipse cx="1135.0" cy="270.0" rx="210.0" ry="50.0" fill="#e5f2e6" stroke="#475569" stroke-width="1.8"/><text x="1135.0" y="265.0" font-size="20" text-anchor="middle" fill="#172536">M-G3</text><text x="1135.0" y="289.0" font-size="20" text-anchor="middle" fill="#172536">Unavailable verification handled</text><polygon points="532.5,440 832.5,440 852.5,499.0 832.5,558 532.5,558 512.5,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="682.5" y="482.0" font-size="20" text-anchor="middle" fill="#172536">M-T4</text><text x="682.5" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Obtain result through</text><text x="682.5" y="530.0" font-size="20" text-anchor="middle" fill="#172536">verification retry</text><polygon points="1437.5,440 1737.5,440 1757.5,499.0 1737.5,558 1437.5,558 1417.5,499.0" fill="#e7effa" stroke="#475569" stroke-width="1.8"/><text x="1587.5" y="482.0" font-size="20" text-anchor="middle" fill="#172536">M-T5</text><text x="1587.5" y="506.0" font-size="20" text-anchor="middle" fill="#172536">Resolve case through</text><text x="1587.5" y="530.0" font-size="20" text-anchor="middle" fill="#172536">authorised review</text><rect x="512.5" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="682.5" y="707.0" font-size="20" text-anchor="middle" fill="#172536">M-R6</text><text x="682.5" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Unresolved verification</text><text x="682.5" y="755.0" font-size="20" text-anchor="middle" fill="#172536">case record</text><rect x="1417.5" y="665" width="340" height="118" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1587.5" y="707.0" font-size="20" text-anchor="middle" fill="#172536">M-R9</text><text x="1587.5" y="731.0" font-size="20" text-anchor="middle" fill="#172536">Authorised review</text><text x="1587.5" y="755.0" font-size="20" text-anchor="middle" fill="#172536">decision</text><path d="M 530.5 997.0 C 474.5 983.0 558.5 953.0 618.5 977.0 C 674.5 960.0 770.5 963.0 790.5 985.0 C 906.5 977.0 906.5 1023.0 842.5 1030.0 C 882.5 1063.0 754.5 1073.0 710.5 1050.0 C 622.5 1073.0 514.5 1059.0 534.5 1038.0 C 466.5 1031.0 478.5 1005.0 530.5 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="682.5" y="1010.0" font-size="20" text-anchor="middle" fill="#172536">M-Q1</text><text x="682.5" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Reliable automated processing</text><path d="M 1435.5 997.0 C 1379.5 983.0 1463.5 953.0 1523.5 977.0 C 1579.5 960.0 1675.5 963.0 1695.5 985.0 C 1811.5 977.0 1811.5 1023.0 1747.5 1030.0 C 1787.5 1063.0 1659.5 1073.0 1615.5 1050.0 C 1527.5 1073.0 1419.5 1059.0 1439.5 1038.0 C 1371.5 1031.0 1383.5 1005.0 1435.5 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="1587.5" y="1010.0" font-size="20" text-anchor="middle" fill="#172536">M-Q3</text><text x="1587.5" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Minimal processing delays</text><text x="260" y="1101" font-size="18" text-anchor="start" fill="#243246">Delegated goals / interface resources: endpoint IDs are resolved in the dependency views.</text><ellipse cx="470.0" cy="1175.0" rx="200.0" ry="45.0" fill="#e5f2e6" stroke="#475569" stroke-width="1.8"/><text x="470.0" y="1158.0" font-size="20" text-anchor="middle" fill="#172536">M-G4</text><text x="470.0" y="1182.0" font-size="20" text-anchor="middle" fill="#172536">Unresolved verification case</text><text x="470.0" y="1206.0" font-size="20" text-anchor="middle" fill="#172536">reviewed</text><text x="50" y="1291" font-size="18" text-anchor="start" fill="#243246">Oval = goal | Hexagon = task | Rectangle = resource | Cloud = quality (softgoal). Child -&gt; parent AND = all; OR = an alternative. Resource -&gt; task = needed-by. Help / Hurt = quality contribution; qualifies =</text><text x="50" y="1314" font-size="18" text-anchor="start" fill="#243246">desired resource quality.</text><text x="50" y="1381" font-size="18" text-anchor="start" fill="#243246">Read with README.md and the dependency views. Dependencies point from the actor relying on something to its provider. Repeated endpoint IDs refer to the same element. Conditional tasks describe</text><text x="50" y="1404" font-size="18" text-anchor="start" fill="#243246">responsibilities, not a mandatory sequence of process steps.</text></g></svg>