 2</text><text x="50" y="101" font-size="19" text-anchor="start" fill="#243246">3 November 2026 | Exact SR endpoint IDs; read with actor views</text><text x="50" y="146" font-size="18" text-anchor="start" fill="#243246">Depender (relies on something) -&gt; typed dependum -&gt; dependee (provides it). Each row is a distinct dependency. IDs refer to the actor-internal elements in the SR views.</text><text x="50" y="226" font-size="18" text-anchor="start" fill="#243246">DEPENDENCY</text><text x="315" y="226" font-size="18" text-anchor="start" fill="#243246">DEPENDER / INTERNAL ELEMENT</text><text x="870" y="226" font-size="18" text-anchor="start" fill="#243246">DEPENDUM</text><text x="1450" y="226" font-size="18" text-anchor="start" fill="#243246">DEPENDEE / INTERNAL ELEMENT</text><text x="50" y="280" font-size="17" text-anchor="start" fill="#243246">D13 | UC1</text><text x="315" y="296" font-size="18" text-anchor="start" fill="#243246">Registered Producer</text><ellipse cx="668.0" cy="313.0" rx="53.0" ry="53.0" fill="#e7ecef" stroke="#475569" stroke-width="1.8"/><text x="668.0" y="308.0" font-size="20" text-anchor="middle" fill="#172536">P</text><text x="668.0" y="332.0" font-size="20" text-anchor="middle" fill="#172536">P-R4</text><rect x="870" y="265" width="430" height="96" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1085.0" y="320.0" font-size="20" text-anchor="middle" fill="#172536">Listing standards and guidance</text><ellipse cx="1503.0" cy="313.0" rx="53.0" ry="53.0" fill="#e7ecef" stroke="#475569" stroke-width="1.8"/><text x="1503.0" y="308.0" font-size="20" text-anchor="middle" fill="#172536">A</text><text x="1503.0" y="332.0" font-size="20" text-anchor="middle" fill="#172536">A-R2</text><text x="1575" y="296" font-size="18" text-anchor="start" fill="#243246">Marketplace Admin</text><text x="50" y="406" font-size="17" text-anchor="start" fill="#243246">D14 | UC1</text><text x="315" y="422" font-size="18" text-anchor="start" fill="#243246">Customer</text><ellipse cx="668.0" cy="439.0" rx="53.0" ry="53.0" fill="#e7ecef" stroke="#475569" stroke-width="1.8"/><text x="668.0" y="434.0" font-size="20" text-anchor="middle" fill="#172536">K</text><text x="668.0" y="458.0" font-size="20" text-anchor="middle" fill="#172536">K-R3</text><rect x="870" y="391" width="430" height="96" fill="#fff4db" stroke="#475569" stroke-width="1.8"/><text x="1085.0" y="434.0" font-size="20" text-anchor="middle" fill="#172536">Published safety and</text><text x="1085.0" y="458.0" font-size="20" text-anchor="middle" fill="#172536">certification data</text><ellipse cx="1503.0" cy="439.0" rx="53.0" ry="53.0" fill="#e7ecef" stroke="#475569" stroke-width="1.8"/><text x="1503.0" y="434.0" font-size="20" text-anchor="middle" fill="#172536">M</text><text x="1503.0" y="458.0" font-size="20" text-anchor="middle" fill="#172536">M-R7</text><text x="1575" y="422" font-size="18" text-anchor="start" fill="#243246">Marketplace Platform</text><text x="50" y="558" font-size="18" text-anchor="start" fill="#243246">UC1 = core use case; PROPOSED = review policy assumption; CONTEXT = wider enterprise. Dependencies show responsibility, not message timing.</text></g></svg>