rt" fill="#243246">desired resource quality.</text><text x="50" y="1381" font-size="18" text-anchor="start" fill="#243246">Read with README.md and the dependency views. Dependencies point from the actor relying on something to its provider. Repeated endpoint IDs refer to the same element. Conditional tasks describe</text><text x="50" y="1404" font-size="18" text-anchor="start" fill="#243246">responsibilities, not a mandatory sequence of process steps.</text></g></svg>