ext x="1135.0" y="1034.0" font-size="20" text-anchor="middle" fill="#172536">Minimal administrative effort</text><path d="M 1586.3333333333333 997.0 C 1530.3333333333333 983.0 1614.3333333333333 953.0 1674.3333333333333 977.0 C 1730.3333333333333 960.0 1826.3333333333333 963.0 1846.3333333333333 985.0 C 1962.3333333333333 977.0 1962.3333333333333 1023.0 1898.3333333333333 1030.0 C 1938.3333333333333 1063.0 1810.3333333333333 1073.0 1766.3333333333333 1050.0 C 1678.3333333333333 1073.0 1570.3333333333333 1059.0 1590.3333333333333 1038.0 C 1522.3333333333333 1031.0 1534.3333333333333 1005.0 1586.3333333333333 997.0 Z" fill="#f0e7fa" stroke="#475569" stroke-width="1.8"/><text x="1738.3333333333333" y="998.0" font-size="20" text-anchor="middle" fill="#172536">P-Q3</text><text x="1738.3333333333333" y="1022.0" font-size="20" text-anchor="middle" fill="#172536">Understandable validation</text><text x="1738.3333333333333" y="1046.0" font-size="20" text-anchor="middle" fill="#172536">feedback</text><text x="260" y="1101" font-size="18" text-anchor="start" fill="#243246">Delegated goals / interface resources: endpoint IDs are resolved in the dependency views.</text><ellipse cx="470.0" cy="1175.0" rx="200.0" ry="45.0" fill="#e5f2e6" stroke="#475569" stroke-width="1.8"/><text x="470.0" y="1170.0" font-size="20" text-anchor="middle" fill="#172536">P-G3</text><text x="470.0" y="1194.0" font-size="20" text-anchor="middle" fill="#172536">Valid products published</text><text x="50" y="1291" font-size="18" text-anchor="start" fill="#243246">Oval = goal | Hexagon = task | Rectangle = resource | Cloud = quality (softgoal). Child -&gt; parent AND = all; OR = an alternative. Resource -&gt; task = needed-by. Help / Hurt = quality contribution; qualifies =</text><text x="50" y="1314" font-size="18" text-anchor="start" fill="#243246">desired resource quality.</text><text x="50" y="1381" font-size="18" text-anchor="start" fill="#243246">Read with README.md and the dependency views. Dependencies point from the actor relying on something to its provider. Repeated endpoint IDs refer to the same element. Conditional tasks describe</text><text x="50" y="1404" font-size="18" text-anchor="start" fill="#243246">responsibilities, not a mandatory sequence of process steps.</text></g></svg>